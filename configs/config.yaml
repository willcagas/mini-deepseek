tokenizer_name: "HuggingFaceTB/SmolLM2-135M"

model:
  hidden_size: 512
  vocab_size: 49152
  num_layers: 12
  num_dense_layers: 1
  dense_inter_size: 3072

mla:
  num_heads: 8
  kv_latent_size: 128
  query_latent_size: 128
  qk_nope_head_dim: 64
  qk_rope_head_dim: 32
  value_head_dim: 64

moe:
  routed_experts: 8
  shared_experts: 1
  routed_expert_inter_size: 896
  shared_expert_inter_size: 896
  experts_per_token: 2
  bias_update_gamma: 1.0e-3
  aux_loss_alpha: 1.0e-4

rms:
  epsilon: 1.0e-6
  max_sequence_len: 2048

data:
  dataset: "HuggingFaceFW/fineweb-edu"
  subset: "sample-10BT"
  output_dir: /data/fineweb_10bt_001
  seed: 42
  validation_fraction: 0.01
  num_workers: 8
  num_tasks: 8
  documents_per_task: -1
  tokenization_batch_size: 256
  tokens_per_shard: 100000000

training:
  sequence_len: 2048
  batch_size: 8
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5

  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0

  gradient_accumulation_steps: 16
  total_steps: 38147
  warmup_steps: 500
  decay_start_step: 30000

  eval_interval: 500
  eval_batches: 100
  checkpoint_interval: 500
  checkpoint_dir: /data/checkpoints/fineweb_10bt_001

  mtp_loss_weight: 0.3